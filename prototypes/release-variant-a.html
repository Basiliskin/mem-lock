<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeaveCheck A: separate screens</title><style>
:root{--ink:#111;--bg:#fff;--ok:#0B6B2E;--bad:#B3141C;--primary:#0B3D91;--warn:#FFF3C4;--warnb:#7A5C00;--muted:#3D3D3D;--focus:#E07B00;--line:#8a8a8a;--soft:#EEF2F9}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#ddd;color:var(--ink);font:20px/1.35 system-ui,Roboto,sans-serif}
.phone{max-width:420px;min-height:100vh;margin:auto;background:var(--bg);padding:16px}
.mock{background:#222;color:#fff;font-size:16px;padding:10px 16px;max-width:420px;margin:auto}.mock select{color:#111;background:#fff;font-size:16px;max-width:100%;padding:4px}.mock label{display:block}
h1{overflow-wrap:anywhere;font-size:28px;margin:8px 0 14px}h2{font-size:22px;margin:0}p{margin:8px 0}.muted{color:var(--muted);font-size:18px}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:56px;border-radius:10px;border:2px solid var(--primary);background:#fff;color:var(--primary);font-weight:600;padding:10px 14px;width:100%;margin:6px 0;cursor:pointer}
button.main{background:var(--primary);color:#fff}button.danger{border-color:var(--bad);color:var(--bad)}button.back{width:auto;border:0;padding:8px 0;min-height:48px;text-align:left}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}h1:focus{outline:none}
input,textarea{width:100%;border:2px solid var(--ink);border-radius:8px;padding:12px;background:#fff;min-height:56px}label{display:block;font-weight:600;margin:12px 0 4px}
.note{background:var(--warn);border:2px solid var(--warnb);border-radius:8px;padding:12px;margin:10px 0}.err{border-color:var(--bad);background:#fff;color:var(--bad);font-weight:600}.done{border:2px solid var(--ok);color:var(--ok);background:#fff;font-weight:600;border-radius:8px;padding:12px;margin:10px 0}
.card{border:2px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.tag{display:inline-block;font-size:16px;font-weight:700;background:var(--primary);color:#fff;border-radius:6px;padding:3px 8px}
.row{display:flex;gap:8px;align-items:center}.row button{margin:0}.step{width:64px;flex:none;font-size:28px;padding:0}.row input{text-align:center;font-size:24px;font-weight:700;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1 1 90px;width:auto}[aria-pressed=true],[aria-checked=true]{background:var(--primary)!important;color:#fff!important}
input[type=range]{padding:0;border:0;min-height:48px;accent-color:var(--primary)}
details{border:2px solid var(--line);border-radius:10px;margin:10px 0}summary{font-weight:700;font-size:22px;padding:14px;min-height:56px;cursor:pointer}summary small{display:block;font-weight:400;font-size:18px;color:var(--muted)}details>div{padding:0 14px 14px}
.sheetbg{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:5}.sheet{background:#fff;width:100%;max-width:420px;max-height:92vh;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body><div id="app"></div><div id="live" class="sr" aria-live="polite"></div><script>
const TX={ru:{settings:'Настройки для близких',places:'Места с напоминанием',adv:'Точные значения',lang:'Язык',back:'Назад',placesHelp:'Напомним при уходе отсюда, даже после короткого визита (от 1 минуты).',none:'Мест пока нет.',add:'Отметить место, где вы сейчас',name:'Название',msg:'Сообщение',namePh:'Например, бассейн',msgPh:'Например, возьмите полотенце',save:'Отметить это место',cancel:'Отмена',needText:'Сначала введите название и сообщение.',noFix:'Не удалось определить, где вы. Место не сохранено. Выйдите на улицу и попробуйте снова.',saved:'Место сохранено',removed:'Место удалено',remove:'Удалить',removeQ:'Удалить это место? Напоминаний с этим сообщением больше не будет.',clash:'Это место уже отмечено как тихое («Дом»). Одно место не может быть и тихим, и с напоминанием. Что оставить?',keepQuiet:'Оставить тихим',keepRem:'Сделать местом с напоминанием',kept:'Оставили тихим местом',stayTime:'Сколько пробыть на месте',stayArea:'Размер места',speed:'Скорость транспорта',walk:'Сколько идти после поездки',min:'мин',m:'м',kmh:'км/ч',sec:'сек',from:'от',to:'до',rec:'рекомендуем',current:'Сейчас',custom:'Свои значения',often:'Чаще',normal:'Обычно',less:'Реже',presetHelp:'Выбор варианта заменит время и размер места.',saveVals:'Сохранить',reset:'Вернуть рекомендуемые',wasReset:'Рекомендуемые значения возвращены',savedV:'Значения сохранены',limit:(l,a,b,u)=>`${l}: можно от ${a} до ${b} ${u}. Не сохранено.`,riskTitle:'Напоминания могут не прийти:',riskStay:'при таком времени короткие остановки останутся без напоминания.',riskArea:'при таком размере уход с места будет замечен позже.',riskSpeed:'медленный транспорт может быть принят за ходьбу.',riskWalk:'напоминание после поездки придёт позже чем через минуту.',saveAny:'Всё равно сохранить',change:'Изменить',phone:'Как на телефоне',phoneNow:'сейчас русский',langSaved:'Язык изменён',preview:'Следующее напоминание:',reminder:'Ваши вещи с вами?',mock:'Только для примера: где телефон',mPool:'В новом месте',mHome:'Дома (тихое место)',mNone:'Геолокация не определяется',sumP:n=>`Отмечено: ${n}`},
en:{settings:'Helper settings',places:'Reminder Places',adv:'Exact values',lang:'Language',back:'Back',placesHelp:'Reminds on leaving, even after a short visit (1 minute or more).',none:'No places yet.',add:'Mark where you are now',name:'Name',msg:'Message',namePh:'For example, pool',msgPh:'For example, take your towel',save:'Mark this place',cancel:'Cancel',needText:'Enter a name and message first.',noFix:'Could not find your location, so nothing was saved. Go outside and try again.',saved:'Place saved',removed:'Place removed',remove:'Remove',removeQ:'Remove this place? Its Reminders will stop.',clash:'This place is already a Quiet Place ("Home"). A place cannot be both. Which should it be?',keepQuiet:'Keep it quiet',keepRem:'Make it a Reminder Place',kept:'Kept as a Quiet Place',stayTime:'Time to count as a stay',stayArea:'Size of the place',speed:'Vehicle speed',walk:'Walking time after a ride',min:'min',m:'m',kmh:'km/h',sec:'sec',from:'from',to:'to',rec:'recommended',current:'Now',custom:'Custom values',often:'More often',normal:'Normal',less:'Less often',presetHelp:'Choosing one replaces the time and place size.',saveVals:'Save',reset:'Reset to recommended',wasReset:'Recommended values restored',savedV:'Values saved',limit:(l,a,b,u)=>`${l}: must be ${a} to ${b} ${u}. Not saved.`,riskTitle:'Reminders may be missed:',riskStay:'short stops will give no Reminder.',riskArea:'leaving will be noticed later.',riskSpeed:'a slow vehicle could be mistaken for walking.',riskWalk:'the Reminder after a ride will take over a minute.',saveAny:'Save anyway',change:'Change',phone:'Same as phone',phoneNow:'now Russian',langSaved:'Language changed',preview:'Next Reminder:',reminder:'Do you have your things?',mock:'Example only: where the phone is',mPool:'At a new place',mHome:'At home (Quiet Place)',mNone:'No location fix',sumP:n=>`Marked: ${n}`}};
const F=[['stayTime',1,30,5,'min',15,'riskStay'],['stayArea',30,300,75,'m',150,'riskArea'],['speed',7,30,14,'kmh',20,'riskSpeed'],['walk',10,120,30,'sec',60,'riskWalk']];
const PRE={often:[3,75],normal:[5,75],less:[10,100]};
const S={screen:'hub',choice:'phone',at:'new',places:[{name:'Бассейн',msg:'Возьмите полотенце'}],vals:{stayTime:5,stayArea:75,speed:14,walk:30},draft:null,preset:'normal',msg:null,sheet:null,form:{name:'',msg:''},risks:null};
const L=()=>S.choice==='en'?'en':'ru',t=k=>TX[L()][k],esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function say(text,kind){S.msg={text,kind};const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=text,30)}
function msgHtml(){return S.msg?`<div class="${S.msg.kind==='err'?'note err':'done'}">${esc(S.msg.text)}</div>`:''}
function draft(){return S.draft||(S.draft={...S.vals})}
function addPlace(){const n=S.form.name.trim(),m=S.form.msg.trim();if(!n||!m){say(t('needText'),'err');return draw()}if(S.at==='none'){say(t('noFix'),'err');return draw()}if(S.at==='home'){S.sheet='clash';S.msg=null;return draw()}commit()}
function commit(){S.places.push({name:S.form.name.trim(),msg:S.form.msg.trim()});S.form={name:'',msg:''};S.sheet=null;say(t('saved'));draw()}
function removePlace(i){S.places.splice(i,1);S.sheet=null;say(t('removed'));draw()}
function saveVals(force){const d=draft();for(const[k,a,b,,u]of F){const v=Number(d[k]);if(!Number.isFinite(v)||v<a||v>b){say(t('limit')(t(k),a,b,t(u)),'err');S.risks=null;return draw()}}
const r=F.filter(f=>Number(d[f[0]])>f[5]);if(r.length&&!force){S.risks=r.map(f=>f[6]);S.msg=null;return draw()}
F.forEach(f=>S.vals[f[0]]=Number(d[f[0]]));S.draft=null;S.risks=null;const p=Object.keys(PRE).find(k=>PRE[k][0]==S.vals.stayTime&&PRE[k][1]==S.vals.stayArea&&S.vals.speed==14&&S.vals.walk==30);S.preset=p||'custom';say(t('savedV'));draw()}
function pick(p){const d=draft();d.stayTime=PRE[p][0];d.stayArea=PRE[p][1];S.risks=null;F.forEach(f=>S.vals[f[0]]=Number(d[f[0]]));S.draft=null;S.preset=(S.vals.speed==14&&S.vals.walk==30)?p:'custom';say(t('savedV'));draw()}
function reset(){S.vals={stayTime:5,stayArea:75,speed:14,walk:30};S.draft=null;S.risks=null;S.preset='normal';say(t('wasReset'));draw()}
function setLang(c){S.choice=c;document.documentElement.lang=L();say(t('langSaved'));draw()}
function presetName(){return S.preset==='custom'?t('custom'):t(S.preset)}
function riskHtml(){return S.risks?`<div class="note" role="alert"><b>${t('riskTitle')}</b><ul>${S.risks.map(k=>`<li>${t(k)}</li>`).join('')}</ul><button class="main" onclick="saveVals(true)">${t('saveAny')}</button><button onclick="S.risks=null;draw()">${t('change')}</button></div>`:''}
function placeList(){return S.places.length?S.places.map((p,i)=>`<div class="card"><h2>${esc(p.name)}</h2><p>«${esc(p.msg)}»</p><button class="danger" onclick="S.sheet=${i};draw()">${t('remove')}: ${esc(p.name)}</button></div>`).join(''):`<p class="muted">${t('none')}</p>`}
function formHtml(){return `<label for="pn">${t('name')}</label><input id="pn" maxlength="40" placeholder="${t('namePh')}" value="${esc(S.form.name)}" oninput="S.form.name=this.value"><label for="pm">${t('msg')}</label><input id="pm" maxlength="80" placeholder="${t('msgPh')}" value="${esc(S.form.msg)}" oninput="S.form.msg=this.value"><button class="main" onclick="addPlace()">${t('save')}</button>`}
function dialogs(){if(S.sheet==='clash')return dlg(`<p>${t('clash')}</p><button onclick="S.sheet=null;S.form={name:'',msg:''};say(t('kept'));draw()">${t('keepQuiet')}</button><button class="main" onclick="commit()">${t('keepRem')}</button>`);if(typeof S.sheet==='number')return dlg(`<p>${t('removeQ')}</p><button class="danger" onclick="removePlace(${S.sheet})">${t('remove')}</button><button onclick="S.sheet=null;draw()">${t('cancel')}</button>`);return ''}
function dlg(b){return `<div class="sheetbg"><div class="sheet" role="alertdialog" aria-modal="true" aria-label="${t('places')}" id="dlg" tabindex="-1">${b}</div></div>`}
function mockBar(){return `<div class="mock"><label for="at">${t('mock')}</label><select id="at" onchange="S.at=this.value;S.msg=null;draw()">${[['new','mPool'],['home','mHome'],['none','mNone']].map(([v,k])=>`<option value="${v}" ${S.at===v?'selected':''}>${t(k)}</option>`).join('')}</select></div>`}
let lastFocus=null;
function draw(){const a=document.activeElement,id=a&&a.id;document.getElementById('app').innerHTML=mockBar()+`<main class="phone">${view()}</main>`+dialogs();const d=document.getElementById('dlg');if(d)d.focus();else if(id&&document.getElementById(id))document.getElementById(id).focus()}
function go(s){S.screen=s;S.msg=null;S.risks=null;S.draft=null;draw();const h=document.querySelector('h1');if(h){h.tabIndex=-1;h.focus()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet!==null){S.sheet=null;draw()}});

function field(f){const[k,a,b,rec,u]=f,d=draft(),st=Math.max(1,k==='stayArea'?5:k==='walk'?5:1);return `<div class="card"><label for="${k}">${t(k)}, ${t(u)}</label><div class="row"><button class="step" aria-label="${t(k)} −" onclick="bump('${k}',-${st})">−</button><input id="${k}" inputmode="numeric" value="${esc(d[k])}" oninput="draft().${k}=this.value"><button class="step" aria-label="${t(k)} +" onclick="bump('${k}',${st})">+</button></div><p class="muted">${t('from')} ${a} ${t('to')} ${b}, ${t('rec')} ${rec}</p></div>`}
function bump(k,n){const d=draft(),f=F.find(x=>x[0]===k);d[k]=Math.min(f[2],Math.max(f[1],Number(d[k])+n));document.getElementById(k).value=d[k]}
function view(){const back=`<button class="back" onclick="go('hub')">← ${t('back')}</button>`;
if(S.screen==='hub')return `<h1>${t('settings')}</h1>${msgHtml()}<button onclick="go('places')">${t('places')}<br><span class="muted">${t('sumP')(S.places.length)}</span></button><button onclick="go('adv')">${t('adv')}<br><span class="muted">${t('current')}: ${presetName()}</span></button><button onclick="go('lang')">${t('lang')}<br><span class="muted">${S.choice==='phone'?t('phone'):''}${S.choice==='ru'?'Русский':S.choice==='en'?'English':''}</span></button>`;
if(S.screen==='places')return back+`<h1>${t('places')}</h1><p class="muted">${t('placesHelp')}</p>${msgHtml()}${placeList()}<div class="card"><h2>${t('add')}</h2>${formHtml()}</div>`;
if(S.screen==='adv')return back+`<h1>${t('adv')}</h1><p><span class="tag">${t('current')}: ${presetName()}</span></p>${msgHtml()}<div class="seg">${Object.keys(PRE).map(p=>`<button aria-pressed="${S.preset===p}" onclick="pick('${p}')">${t(p)}</button>`).join('')}</div><p class="muted">${t('presetHelp')}</p>${F.map(field).join('')}${riskHtml()}<button class="main" onclick="saveVals()">${t('saveVals')}</button><button onclick="reset()">${t('reset')}</button>`;
return back+`<h1>${t('lang')}</h1>${msgHtml()}<div role="radiogroup" aria-label="${t('lang')}">${[['phone',t('phone')+' ('+t('phoneNow')+')'],['ru','Русский'],['en','English']].map(([v,n])=>`<button role="radio" aria-checked="${S.choice===v}" onclick="setLang('${v}')">${n}</button>`).join('')}</div><div class="card"><p class="muted">${t('preview')}</p><h2>${t('reminder')}</h2></div>`}
draw();</script></body></html>
